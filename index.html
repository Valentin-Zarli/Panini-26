<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Cartes Collaboratif</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .status {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        .status.success { border-left-color: #2ecc71; }
        .status.loading { border-left-color: #f39c12; }
        
        #login-screen {
            text-align: center;
            padding: 40px 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            width: 200px;
            margin-right: 10px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #2980b9; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: #f8f9fa; color: #2c3e50; }
        tr:hover { background-color: #f1f2f6; }
        .quantity { font-weight: bold; display: inline-block; width: 50px; text-align: center; font-size: 16px; }
        
        .btn-action {
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            margin: 0 4px;
        }
        .btn-minus { background-color: #e74c3c; }
        .btn-minus:hover { background-color: #c0392b; }
        .btn-plus { background-color: #2ecc71; }
        .btn-plus:hover { background-color: #27ae60; }
        
        .btn-action:disabled {
            background-color: #bdc3c7 !important;
            cursor: not-allowed;
        }
        .btn-group {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1>👋 C'est qui ?</h1>
        <p>Entre ton prénom pour charger ta liste personnelle de cartes :</p>
        <input type="text" id="username-input" placeholder="Ex: Jules, Alice..." onkeypress="if(event.key === 'Enter') startApp()">
        <button onclick="startApp()">C'est parti !</button>
    </div>

    <div id="app-screen" style="display: none;">
        <h1 id="welcome-msg">Ma Collection</h1>
        <div id="status-msg" class="status success">✅ Connecté. Vos modifications s'enregistrent en direct.</div>

        <table id="table-cards">
            <thead>
                <tr>
                    <th>Nom de la Carte</th>
                    <th>Ma Quantité</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>
</div>

<script>
    // FIX DE L'URL : Remplacement par l'URL active qui correspond à ton script Google
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw7dpx-lUBL-n05FeNKgXkAUt2TdkXWw5cOObQoYVFZQly_j0JFZvv70ejI41ib4EW4/exec";
    
    let currentUser = "";
    
    // Base de données locale de tes cartes (générée à partir de ton fichier Excel)
    let cardsData = [
        { id: "FCW00", qty: 0 }, { id: "FCW1", qty: 0 }, { id: "FCW2", qty: 0 }, { id: "FCW3", qty: 0 },
        { id: "MEX1", qty: 0 }, { id: "MEX2", qty: 0 }, { id: "MEX3", qty: 0 }, { id: "MEX4", qty: 0 },
        { id: "RSA1", qty: 0 }, { id: "RSA2", qty: 0 }, { id: "RSA3", qty: 0 }, { id: "RSA4", qty: 0 },
        { id: "KOR1", qty: 0 }, { id: "KOR2", qty: 0 }, { id: "KOR3", qty: 0 }, { id: "KOR4", qty: 0 },
        { id: "CZE1", qty: 0 }, { id: "CZE2", qty: 0 }, { id: "CZE3", qty: 0 }, { id: "CZE4", qty: 0 }
    ];
    
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const welcomeMsg = document.getElementById('welcome-msg');
    const tableBody = document.getElementById('table-body');

    function startApp() {
        const input = document.getElementById('username-input').value.trim();
        if (!input) return alert("Mets ton prénom gros !");
        
        currentUser = input.charAt(0).toUpperCase() + input.slice(1).toLowerCase();
        
        loginScreen.style.display = 'none';
        appScreen.style.display = 'block';
        welcomeMsg.innerText = `🃏 Collection de ${currentUser}`;
        
        renderTable();
        syncWithGoogle();
    }

    async function syncWithGoogle() {
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "charger", user: currentUser })
            });
        } catch (e) {
            console.log("Synchro initiale effectuée.");
        }
    }

    function renderTable() {
        tableBody.innerHTML = '';
        cardsData.forEach((card) => {
            const tr = document.createElement('tr');
            const localQty = localStorage.getItem(`${currentUser}_${card.id}`) || 0;
            card.qty = parseInt(localQty, 10);
            
            const minusDisabled = card.qty <= 0 ? 'disabled' : '';
            
            tr.innerHTML = `
                <td><strong>${card.id}</strong></td>
                <td><span class="quantity" id="qty-${card.id}">${card.qty}</span></td>
                <td>
                    <div class="btn-group">
                        <button class="btn-action btn-minus" id="btn-minus-${card.id}" ${minusDisabled} onclick="updateCard('${card.id}', 'moins')">-</button>
                        <button class="btn-action btn-plus" id="btn-plus-${card.id}" onclick="updateCard('${card.id}', 'plus')">+</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    window.updateCard = async function(cardId, action) {
        const btnPlus = document.getElementById(`btn-plus-${cardId}`);
        const btnMinus = document.getElementById(`btn-minus-${cardId}`);
        const qtySpan = document.getElementById(`qty-${cardId}`);
        
        let currentQty = parseInt(qtySpan.innerText, 10) || 0;
        
        if (action === "moins" && currentQty <= 0) return;

        if (action === "plus") {
            currentQty += 1;
        } else if (action === "moins") {
            currentQty -= 1;
        }
        qtySpan.innerText = currentQty;
        
        localStorage.setItem(`${currentUser}_${cardId}`, currentQty);
        
        btnPlus.disabled = true;
        btnMinus.disabled = true;

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cardId: cardId, user: currentUser, action: action })
            });
        } catch (err) {
            console.error(err);
        } finally {
            btnPlus.disabled = false;
            btnMinus.disabled = (currentQty <= 0);
        }
    };
</script>

</body>
</html>
