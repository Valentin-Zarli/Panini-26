<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Cartes Collaboratif</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .status {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        .status.success { border-left-color: #2ecc71; }
        .status.loading { border-left-color: #f39c12; }
        
        /* Écran de connexion chill */
        #login-screen {
            text-align: center;
            padding: 40px 20px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            width: 200px;
            margin-right: 10px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #2980b9; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: #f8f9fa; color: #2c3e50; }
        tr:hover { background-color: #f1f2f6; }
        .quantity { font-weight: bold; display: inline-block; width: 40px; text-align: center; }
        
        button.btn-add {
            background-color: #2ecc71;
            padding: 6px 14px;
            font-size: 14px;
        }
        button.btn-add:hover { background-color: #27ae60; }
        button.btn-add:disabled { background-color: #95a5a6; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1>👋 C'est qui ?</h1>
        <p>Entre ton prénom pour charger ta liste personnelle de cartes :</p>
        <input type="text" id="username-input" placeholder="Ex: Jules, Alice..." onkeypress="if(event.key === 'Enter') startApp()">
        <button onclick="startApp()">C'est parti !</button>
    </div>

    <div id="app-screen" style="display: none;">
        <h1 id="welcome-msg">Ma Collection</h1>
        <div id="status-msg" class="status loading">🔄 Synchronisation avec Google Sheet...</div>

        <table id="table-cards" style="display: none;">
            <thead>
                <tr>
                    <th>Nom de la Carte</th>
                    <th>Ma Quantité</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzp-eynOx7WVACkO1Utzu1nzMQX0-d2n-zM6zloXJdJkP3ftVsS1QrZi0Gm5KUDlznw/exec";
    
    let currentUser = "";
    let cardsData = [];
    
    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    const welcomeMsg = document.getElementById('welcome-msg');
    const statusMsg = document.getElementById('status-msg');
    const tableCards = document.getElementById('table-cards');
    const tableBody = document.getElementById('table-body');

    // Se déclenche quand le pote valide son prénom
    function startApp() {
        const input = document.getElementById('username-input').value.trim();
        if (!input) return alert("Mets ton prénom gros !");
        
        // Nettoie le prénom (première lettre en majuscule)
        currentUser = input.charAt(0).toUpperCase() + input.slice(1).toLowerCase();
        
        // Bascule d'écran
        loginScreen.style.display = 'none';
        appScreen.style.display = 'block';
        welcomeMsg.innerText = `🃏 Collection de ${currentUser}`;
        
        loadCards();
    }

    // Charger les cartes filtrées pour CET utilisateur
    async function loadCards() {
        try {
            // On passe le nom de l'utilisateur dans l'URL pour que Google sache quelles quantités renvoyer
            const response = await fetch(`${SCRIPT_URL}?user=${currentUser}`);
            if (!response.ok) throw new Error("Erreur réseau");
            
            cardsData = await response.json();
            
            renderTable();
            statusMsg.className = "status success";
            statusMsg.innerText = `✅ Connecté en tant que ${currentUser}. Tes modifications s'enregistrent en direct.`;
            tableCards.style.display = 'table';
        } catch (err) {
            console.error(err);
            statusMsg.className = "status";
            statusMsg.style.borderLeftColor = "#e74c3c";
            statusMsg.innerText = "❌ Erreur au chargement. As-tu bien mis à jour le déploiement sur Google Apps Script ?";
        }
    }

    function renderTable() {
        tableBody.innerHTML = '';
        cardsData.forEach((card) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${card.id}</strong></td>
                <td><span class="quantity" id="qty-${card.id}">${card.qty}</span></td>
                <td>
                    <button class="btn-add" id="btn-${card.id}" onclick="incrementCard('${card.id}')">+</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // Envoyer le +1 avec le nom de l'utilisateur
    window.incrementCard = async function(cardId) {
        const btn = document.getElementById(`btn-${cardId}`);
        const qtySpan = document.getElementById(`qty-${cardId}`);
        
        btn.disabled = true;
        btn.innerText = "...";

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ cardId: cardId, user: currentUser }) // On envoie le prénom ici !
            });

            const currentQty = parseInt(qtySpan.innerText, 10) || 0;
            qtySpan.innerText = currentQty + 1;

        } catch (err) {
            console.error(err);
            alert("Erreur de sauvegarde.");
        } finally {
            btn.disabled = false;
            btn.innerText = "+";
        }
    };
</script>

</body>
</html>
